name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# PINNED to go 1.27.1, matching the go.mod floor -- not "stable".
#
# A channel alias is not a version: nothing compares it, so nothing opens a pull
# request, and the 1.26 -> 1.27 MINOR arrived here with no commit to review.
# That matters for this repository in particular, because a minor Go changes
# gofmt and recounts basic blocks, and the lane below gates TOTAL coverage at
# exactly 100% with no margin. Measured on one commit before pinning: 100.0% on
# 171 functions under both 1.26.4 and 1.27.1.
#
# And "arch loong64 (qemu)" EXECUTES the suite, so golang/go#81000 -- a
# byte-sized result spilled with an 8-byte MOVD -- can actually reach it. The
# backport #81147 is still open: go1.27.1 ships (Cvt64Fto32 ...) => (TRUNCDW
# ...) with 25 op-codes declared reg: fp11. This code emits 12 of the four
# conversions (11 TRUNCDV, 1 TRUNCDW) in place, sampleIndex, stepper,
# ScalingAdvice, ceilInt and buildVTab -- so that lane is the witness, not an
# argument. If it goes red, pin back to 1.26.x and say so here.
jobs:
  # A workflow that fails to PARSE reports nothing at all -- no red cross, no
  # run, just silence that reads exactly like success. actionlint is the only
  # thing that catches it, so it is the first lane here.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # Every file must be gofmt-clean.
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go version
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  # Build, vet, race-test, and enforce 100% statement coverage on three OSes.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # Run the suite on the six supported 64-bit targets. amd64/arm64 run natively;
  # the rest run under qemu-user. This is all float64 arithmetic, so these lanes
  # are the gate on platform-dependent floating-point behaviour: s390x is
  # big-endian with a different FPU implementation, and the projection maths
  # leans on Atan2, Asin and Acos at their domain edges.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go version
      - run: go env GOARCH && go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go version
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...
